server:
  port: 8000

soundcharts:
  # Soundcharts API — source primaire de métadonnées musicales
  # Credentials : https://soundcharts.com/
  # Sans credentials, Soundcharts est ignoré et Spotify prend le relais.
  app-id:  ${SOUNDCHARTS_APP_ID:SA34-API_EA6FB274}
  api-key: ${SOUNDCHARTS_API_KEY:ecdb29da90754c5a}
  base-url: ${SOUNDCHARTS_BASE_URL:https://customer.soundcharts.com}
  search-limit: 5


springdoc:
  swagger-ui:
    path: /docs
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
  api-docs:
    path: /api-docs

audio:
  supported-extensions: mp3,flac,wav,aiff,m4a,ogg

spotify:
  client-id: ${SPOTIFY_CLIENT_ID:3475fbed191c4e66a3767f3cf0314d12}
  client-secret: ${SPOTIFY_CLIENT_SECRET:f9b0297135264fe3afba97ad87323be0}
  auth-url: https://accounts.spotify.com/api/token
  rate-limit:
    requests-per-second: 10
    cache-ttl-minutes: 60



spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ayan}
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER:ayan}
    password: ${POSTGRES_PASSWORD:ayan}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  data:
    redis:
      host: localhost
      port: 6379
  ai:
    ollama:
      base-url: http://localhost:11434
      init:
        pull-model-strategy: when_missing
        timeout: 120s
      chat:
        options:
          model: qwen3:8b
          temperature: 0.3
          num_ctx: 8192
          num_predict: 1024
      embedding:
        options:
          model: nomic-embed-text
    vectorstore:
      qdrant:
        host: localhost
        port: 6334
        collection-name: dj-tracks
        initialize-schema: true

dj-tagger:
  rag:
    similarity-threshold: 0.7
    max-similar-tracks: 5

logging:
  level:
    com.djtools.ayan: INFO
    org.springframework.ai: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
