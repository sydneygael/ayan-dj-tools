server:
  port: 8000

tavily:
  api-key: ${TAVILY_API_KEY:}
  max-results: 3

soundcharts:
  # Soundcharts API — source primaire de métadonnées musicales
  # Credentials : https://soundcharts.com/
  # Sans credentials, Soundcharts est ignoré et Spotify prend le relais.
  app-id:  ${SOUNDCHARTS_APP_ID:}
  api-key: ${SOUNDCHARTS_API_KEY:}
  base-url: ${SOUNDCHARTS_BASE_URL:https://customer.api.soundcharts.com}
  search-limit: 5


springdoc:
  swagger-ui:
    path: /docs
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
  api-docs:
    path: /api-docs

audio:
  supported-extensions: mp3,flac,wav,aiff,m4a,ogg

spotify:
  client-id: ${SPOTIFY_CLIENT_ID:}
  client-secret: ${SPOTIFY_CLIENT_SECRET:}
  auth-url: https://accounts.spotify.com/api/token
  rate-limit:
    requests-per-second: 10
    cache-ttl-minutes: 60



spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ayan}
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER:ayan}
    password: ${POSTGRES_PASSWORD:ayan}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  data:
    redis:
      host: localhost
      port: 6379

ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  chat:
    model: ${OLLAMA_CHAT_MODEL:llama3.1:8b}
    temperature: 0.3
    num-ctx: 8192
    simple-timeout-seconds: 60
  embedding:
    model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

qdrant:
  host: ${QDRANT_HOST:localhost}
  port: ${QDRANT_PORT:6334}
  collection-name: dj-tracks

dj-tagger:
  chat:
    timeout-seconds: 600          # requêtes avec tool calls (qui est X, scanne, enrichis...)
    simple-timeout-seconds: 60    # requêtes conversationnelles pures (bonjour, explication...)
  rag:
    similarity-threshold: 0.7
    max-similar-tracks: 5

logging:
  level:
    com.djtools.ayan: INFO
    dev.langchain4j: INFO

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
